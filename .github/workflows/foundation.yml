name: Foundation

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.4.1582
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - run: clojure -M:format
      - run: clojure -M:lint
      - run: clojure -M:check
      - run: clojure -M:test
      - run: clojure -M:test:cljd test smerf.domain.contract-test
      - run: clojure -M:cljd clean
      - run: clojure -M:cljd compile
      - run: flutter analyze

  platform-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: web
          - os: ubuntu-latest
            target: apk
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: windows
          - os: macos-latest
            target: macos
          - os: macos-latest
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: DeLaGuardo/setup-clojure@13.4
        with:
          cli: 1.12.4.1582
      - uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          flutter-version: 3.44.2
          cache: true
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - run: clojure -M:cljd compile
      - if: matrix.target == 'web'
        run: flutter build web
      - if: matrix.target == 'apk'
        run: flutter build apk --debug
      - if: matrix.target == 'linux'
        run: flutter build linux --debug
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'macos'
        run: flutter build macos --debug
      - if: matrix.target == 'ios'
        run: flutter build ios --debug --no-codesign
